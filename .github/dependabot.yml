version: 2
updates:
    # Enable version updates for github-actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          frontend:
              dependency-type: 'production'
          browser-tests:
              dependency-type: 'development'
