<!DOCTYPE html>
<html lang="{{ site.Params.language_tag }}">
<head>
  {{ partial "head.html" . }}
  {{ partialCached "style.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partialCached "footer.html" . }}
  {{ partialCached "script.html" . }}
</body>
</html>
